<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-label="Animated fake hallway camera feed">
  <defs>
    <linearGradient id="hall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22314b"/>
      <stop offset="1" stop-color="#0d1320"/>
    </linearGradient>
  </defs>
  <rect width="960" height="540" fill="url(#hall)"/>
  <rect x="40" y="40" width="880" height="460" fill="none" stroke="#3c4f73" stroke-width="4"/>
  <text x="56" y="78" fill="#8fb5ff" font-family="monospace" font-size="30">CAM-02 HALLWAY (FAKE FEED)</text>

  <rect x="180" y="120" width="120" height="300" fill="#2d3f5f"/>
  <rect x="660" y="120" width="120" height="300" fill="#2d3f5f"/>
  <rect x="300" y="120" width="360" height="300" fill="#1a253a"/>

  <circle cx="330" cy="340" r="26" fill="#8fd3ff">
    <animate attributeName="cx" values="330;620;330" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="r" values="26;32;26" dur="2s" repeatCount="indefinite"/>
  </circle>

  <rect x="320" y="145" width="320" height="14" fill="#ffd26d" opacity="0.6">
    <animate attributeName="opacity" values="0.2;0.9;0.2" dur="1.2s" repeatCount="indefinite"/>
  </rect>

  <text x="62" y="500" fill="#6f93cb" font-family="monospace" font-size="24">Object tracking simulation running</text>
</svg>
